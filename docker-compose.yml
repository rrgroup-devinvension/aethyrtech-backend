version: '3.8'

services:
  db:
    image: mysql:8
    environment:
      # Main database
      MYSQL_DATABASE: ${DB_NAME:-aethyrtech_staging}
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: ${DB_USER:-devuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpass123}
      # We pass DB_NAME so the init script knows which one is the main db
      DB_NAME: ${DB_NAME:-aethyrtech_staging}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount the folder with the specific .sql files
      - ./backups/docker/db:/backups/docker/db:ro
      # Mount the initialization script
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      UPLOAD_LIMIT: 10G
      MEMORY_LIMIT: 10G
      MAX_EXECUTION_TIME: 86400
    ports:
      - "8080:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    profiles: ["fullstack"]
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      # Overriding hosts to point to the docker container instead of external DBs
      - DB_HOST=db
      - XBYTES_DB_HOST=db
      - KARMATECH_DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    profiles: ["fullstack"]
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DB_HOST=db
      - XBYTES_DB_HOST=db
      - KARMATECH_DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  beat:
    profiles: ["fullstack"]
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DB_HOST=db
      - XBYTES_DB_HOST=db
      - KARMATECH_DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
  redis_data:
