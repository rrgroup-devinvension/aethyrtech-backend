name: 🚀 Deploy Django Backend (Production)

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Code Formatting Check (Ruff)
        run: uv run ruff format --check .

      - name: Linting Check (Ruff)
        run: uv run ruff check .

      - name: Type Checking (Mypy)
        run: uv run mypy . --ignore-missing-imports

      - name: Run Tests (Pytest)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: django-insecure-test-key-only
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
        run: uv run pytest --nomigrations

  deploy:
    runs-on: ubuntu-latest
    needs: test
    name: Deploy Django to EC2

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Upload Code to Server
      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "."
          target: "/var/www/vhosts/aethyrtech-api/"

      # 3️⃣ Setup & Restart Services
      - name: Setup Django & Restart Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            echo "📂 Navigating to project..."
            cd /var/www/vhosts/aethyrtech-api

            echo "📁 Ensuring logs directory exists..."
            mkdir -p logs
            sudo setfacl -m u:www-data:rwx logs || true

            echo "📦 Syncing dependencies with uv..."
            uv sync --no-dev

            echo "🐍 Activating virtualenv..."
            source .venv/bin/activate

            echo "🛠 Running migrations..."
            python manage.py migrate --noinput
            python manage.py migrate --database=xbytes_db --noinput
            python manage.py migrate --database=karmatech_db --noinput

            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput

            echo "🔄 Restarting Gunicorn..."
            sudo systemctl restart aethyrtech-gunicorn

            echo "🔄 Restarting Celery..."
            sudo systemctl restart aethyrtech-celery || true

            echo "🌐 Restarting Apache..."
            sudo systemctl restart apache2

            echo "⏳ Waiting for services..."
            sleep 5

            echo "📊 Checking service status..."
            sudo systemctl status aethyrtech-gunicorn --no-pager
            sudo systemctl status aethyrtech-celery --no-pager
