name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aethyrtech_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-django

    - name: Lint and Format Check (Ruff)
      run: |
        # Check formatting (fails if unformatted)
        ruff format --check .
        # Check logic & docstrings
        ruff check .

    - name: Run Tests
      env:
        DEBUG: 1
        DATABASE_URL: postgres://postgres:password@localhost:5432/aethyrtech_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        # Adjust test command based on testing framework (pytest or manage.py test)
        python manage.py test
